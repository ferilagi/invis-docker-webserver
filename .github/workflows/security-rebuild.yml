name: Security Rebuild (patch CVE)

# Kalau ada CVE HIGH/CRITICAL yang sudah punya patch di repo Alpine, rebuild
# image dengan tag yang sama supaya patch nginx / apk terbawa (tanpa ganti
# versi PHP/Node). Kalau tidak ada, workflow hanya cek lalu selesai.
on:
  schedule:
    - cron: "0 4 * * 0" # tiap Minggu 11:00 WIB
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: vars.AUTO_REBUILD != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      count: ${{ steps.cve.outputs.count }}
      php_image_tag: ${{ steps.versions.outputs.php_image_tag }}
      php_node_image_tag: ${{ steps.versions.outputs.php_node_image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
          cache: true

      - name: Nama tag image sekarang
        id: versions
        run: |
          set -euo pipefail
          eval "$(bash scripts/security/current-versions.sh)"
          {
            echo "php_image_tag=${PHP_IMAGE_TAG}"
            echo "php_node_image_tag=${PHP_NODE_IMAGE_TAG}"
          } >>"$GITHUB_OUTPUT"

      - name: Cek CVE yang sudah ada patch-nya
        id: cve
        run: |
          set -euo pipefail
          mkdir -p reports
          trivy image --quiet --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --format json \
            --output reports/fixable.json ferilagi/webserver:latest
          count="$(jq '[.Results[]? | .Vulnerabilities[]?] | length' reports/fixable.json)"
          echo "count=${count}" >>"$GITHUB_OUTPUT"
          echo "CVE HIGH/CRITICAL yang sudah ada patch: ${count}"
          {
            echo "### Cek rebuild"
            echo ""
            echo "CVE HIGH/CRITICAL yang sudah ada patch upstream: **${count}**"
            echo ""
            jq -r '[.Results[]? | .Vulnerabilities[]?]
              | group_by(.PkgName)
              | map({pkg: .[0].PkgName, n: length})
              | sort_by(-.n) | .[0:10] | .[]
              | "- `\(.pkg)`: \(.n)"' reports/fixable.json
          } >>"$GITHUB_STEP_SUMMARY"

  build-php:
    needs: check
    if: needs.check.outputs.count != '' && needs.check.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild tanpa Node
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          file: Dockerfile.withoutNodejs
          platforms: linux/amd64,linux/arm64
          no-cache: true
          push: true
          tags: ferilagi/webserver:${{ needs.check.outputs.php_image_tag }}

  build-node:
    needs: [check, build-php]
    if: needs.check.outputs.count != '' && needs.check.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Rebuild dengan Node
        uses: docker/build-push-action@v6
        env:
          BUILDKIT_PROGRESS: plain
        with:
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          no-cache: true
          push: true
          tags: |
            ferilagi/webserver:${{ needs.check.outputs.php_node_image_tag }}
            ferilagi/webserver:latest

      - name: Ringkasan
        run: |
          {
            echo "### Rebuild selesai"
            echo ""
            echo "| Tag | Status |"
            echo "|---|---|"
            echo "| \`${{ needs.check.outputs.php_image_tag }}\` | di-push ulang |"
            echo "| \`${{ needs.check.outputs.php_node_image_tag }}\` | di-push ulang |"
            echo "| \`latest\` | di-push ulang |"
            echo ""
            echo "Scan berikutnya (workflow **Security Scan**) akan mencatat hasilnya di \`CVE-History.md\`."
          } >>"$GITHUB_STEP_SUMMARY"
